<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OG image — Home dos convites</title>
<!--
  Thumbnail de link da home (seleção entre os dois convites).
  Rasterizada em public/assets/og-image-home.png por tools/og-image.mjs.
  1200 × 630 — o que o WhatsApp usa no card grande de link.
-->
<style>
  @font-face {
    font-family: "Satoshi";
    src: url("../public/assets/fonts/Satoshi-Variable.woff2") format("woff2-variations");
    font-weight: 300 900;
    font-style: normal;
    font-display: block;
  }

  :root {
    --ink: #0b0b0f;
    --green: #68ee95;
    --orange: #ff7057;
    --surface: #151419;
    --font: "Satoshi", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #08080b; font-family: var(--font); }

  .og {
    position: relative;
    display: flex;
    align-items: center;
    gap: 44px;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    padding: 52px 56px;
    background: var(--ink);
    color: #fff;
  }

  .og__glow { position: absolute; border-radius: 50%; pointer-events: none; }

  .og__glow--green {
    top: -300px; right: -160px; width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(104, 238, 149, 0.12) 0%, rgba(11, 11, 15, 0) 70%);
  }

  .og__glow--purple {
    bottom: -320px; left: -200px; width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(152, 67, 255, 0.16) 0%, rgba(11, 11, 15, 0) 70%);
  }

  .og__texto {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    flex: 1;
    min-width: 0;
  }

  .og__lockup { height: 40px; width: auto; display: block; }

  .og__meio { display: flex; flex-direction: column; gap: 20px; }

  .og__eyebrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .og__rule { width: 40px; height: 3px; background: var(--green); display: block; }

  .og__label {
    color: var(--green);
    font-size: 18px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
  }

  .og__pill {
    padding: 7px 18px; border-radius: 100px;
    background: var(--green); color: var(--ink);
    font-size: 16px; font-weight: 900;
    letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
  }

  .og__title {
    margin: 0;
    font-size: 76px; font-weight: 900;
    line-height: 0.94; letter-spacing: -0.03em; text-transform: uppercase;
  }

  .og__lead {
    margin: 0;
    max-width: 560px;
    color: rgba(255, 255, 255, 0.72);
    font-size: 22px; line-height: 1.4;
  }

  .og__seal {
    display: flex; align-items: center; gap: 10px; margin: 0;
    color: var(--orange);
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap;
  }

  .og__seal-mark { width: 9px; height: 9px; background: var(--orange); display: block; }

  /* Os dois convites, à direita */
  .og__convites { position: relative; display: flex; gap: 18px; flex: none; }

  .convite {
    display: flex; flex-direction: column;
    width: 214px; overflow: hidden;
    border-radius: 18px; background: var(--surface);
  }

  .convite img { width: 100%; height: auto; display: block; }

  .convite__info { display: flex; flex-direction: column; gap: 5px; padding: 16px 18px 20px; }

  .convite__data {
    margin: 0; color: var(--green);
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  .convite__nome {
    margin: 0; color: #fff;
    font-size: 26px; font-weight: 900;
    line-height: 1.05; letter-spacing: -0.02em; text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="og" id="og">
  <div class="og__glow og__glow--green"></div>
  <div class="og__glow og__glow--purple"></div>

  <div class="og__texto">
    <img class="og__lockup" src="../public/assets/summit-lockup-horizontal.webp" alt="Mind Summit 2026">

    <div class="og__meio">
      <div class="og__eyebrow">
        <span class="og__rule"></span>
        <span class="og__label">Almoços fechados</span>
        <span class="og__pill">16 + 17 de setembro</span>
      </div>
      <h1 class="og__title">Dois lugares à mesa.</h1>
      <p class="og__lead">Encontros reservados a um grupo restrito de CHROs, durante o Mind Summit 2026.</p>
    </div>

    <p class="og__seal"><span class="og__seal-mark"></span>Convite pessoal · Não transferível</p>
  </div>

  <div class="og__convites">
    <div class="convite">
      <img src="../public/assets/lineup-edmondson.png" alt="">
      <div class="convite__info">
        <p class="convite__data">16 set · 13h30</p>
        <p class="convite__nome">Amy<br>Edmondson</p>
      </div>
    </div>
    <div class="convite">
      <img src="../public/assets/lineup-maslach.png" alt="">
      <div class="convite__info">
        <p class="convite__data">17 set · 13h30</p>
        <p class="convite__nome">Christina<br>Maslach</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
